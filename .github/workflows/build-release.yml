name: Build and publish Android APK
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build (must match config.json version name)'
        required: true
        type: string
      verify_only:
        description: Build the selected workflow ref without modifying a published release
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: android-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.verify_only && github.ref || inputs.tag || github.ref }}
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Validate config and immutable release tag
        if: ${{ !inputs.verify_only }}
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python3 scripts/validate-release.py
      - name: Verify Gradle wrapper
        run: echo '2db75c40782f5e8ba1fc278a5574bab070adccb2d21ca5a6e5ed840888448046  gradle/wrapper/gradle-wrapper.jar' | sha256sum --check
      - name: Install Android SDK components
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"'
      - name: Restore stable signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64" && test -n "$KEYSTORE_PASSWORD" && test -n "$KEY_ALIAS" && test -n "$KEY_PASSWORD" || {
            echo 'Configure all four release signing secrets before releasing. Fresh CI debug keys would break updates.'; exit 1;
          }
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/srmesh-release.jks"
      - name: Build APK
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/srmesh-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ "${{ inputs.verify_only }}" = "true" ]; then
            bash ./gradlew --no-daemon testDebugUnitTest --continue
            bash ./gradlew --no-daemon testDebugUnitTest assembleRelease --dry-run
            bash ./gradlew --no-daemon :app:assembleDebug :app:assembleRelease
          else
            bash ./gradlew --no-daemon :app:assembleRelease
          fi
      - name: Web portal verification
        if: ${{ inputs.verify_only && !cancelled() }}
        run: node --test scripts/comprehensive-web.test.mjs scripts/landing-stats.test.mjs scripts/github-portal.test.mjs scripts/github-stats.test.mjs scripts/gateway-helpers.test.mjs
      - name: Retain test reports
        if: ${{ always() && inputs.verify_only }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: SR-Mesh-verification-reports
          path: |
            app/build/reports/tests/
            app/build/test-results/
          if-no-files-found: warn
          retention-days: 14
      - name: Verify signed release APK
        run: |
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/SR-Mesh.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$RUNNER_TEMP/SR-Mesh.apk"
      - name: Retain verified APK for manual release maintenance
        if: ${{ inputs.verify_only }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: SR-Mesh-signed
          path: ${{ runner.temp }}/SR-Mesh.apk
          if-no-files-found: error
          retention-days: 7
      - name: Publish a new release without replacing counted assets
        if: ${{ !inputs.verify_only }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft > "$RUNNER_TEMP/is-draft" 2>/dev/null; then
            test "$(cat "$RUNNER_TEMP/is-draft")" = true || {
              echo 'Published release exists. Use a new version to preserve download counts.'; exit 1;
            }
            test "$(gh release view "$RELEASE_TAG" --json assets --jq '.assets | length')" = 0 || {
              echo 'Draft already contains assets. Inspect it before retrying.'; exit 1;
            }
          else
            gh release create "$RELEASE_TAG" --draft --verify-tag --title "$RELEASE_TAG" --notes-file build/release-notes.txt
          fi
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/SR-Mesh.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$RUNNER_TEMP/SR-Mesh.apk"
          (cd "$RUNNER_TEMP" && sha256sum SR-Mesh.apk > SR-Mesh.apk.sha256)
          release_id=$(gh release view "$RELEASE_TAG" --json databaseId --jq .databaseId)
          gh api --method POST \
            -H 'Content-Type: application/vnd.android.package-archive' \
            --input "$RUNNER_TEMP/SR-Mesh.apk" \
            "https://uploads.github.com/repos/$GH_REPO/releases/$release_id/assets?name=SR-Mesh.apk" --silent
          gh release upload "$RELEASE_TAG" "$RUNNER_TEMP/SR-Mesh.apk.sha256"
          gh release edit "$RELEASE_TAG" --draft=false --latest
      - name: Remove signing material
        if: always()
        run: rm -f -- "$RUNNER_TEMP/srmesh-release.jks"
