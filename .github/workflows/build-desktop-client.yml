name: Build native gateway workspace
on:
  push:
    tags: ['desktop-client-v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  portable:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: desktop-client/package-lock.json
      - run: npm ci --prefix desktop-client
      - run: npm test --prefix desktop-client
      - run: node --test scripts/gateway-workspace.test.mjs
      - name: Build signed Windows packages
        env:
          CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
          AZURE_SIGN_ENDPOINT: ${{ vars.AZURE_SIGN_ENDPOINT }}
          AZURE_SIGN_ACCOUNT: ${{ vars.AZURE_SIGN_ACCOUNT }}
          AZURE_SIGN_PROFILE: ${{ vars.AZURE_SIGN_PROFILE }}
          AZURE_SIGN_PUBLISHER: ${{ vars.AZURE_SIGN_PUBLISHER }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        run: npm run dist --prefix desktop-client
      - name: Require valid non-self-signed release signatures
        shell: pwsh
        run: |
          $files = @('docs/downloads/win-unpacked/SR MESH Desktop.exe','docs/downloads/SR-Mesh-Windows-Portable-v1.0.3.exe','docs/downloads/SR-Mesh-Windows-Setup-v1.0.3.exe')
          foreach ($file in $files) {
            $signature = Get-AuthenticodeSignature -LiteralPath $file
            if ($signature.Status -ne 'Valid' -or -not $signature.SignerCertificate -or $signature.SignerCertificate.Subject -eq $signature.SignerCertificate.Issuer) {
              throw "Release requires valid provider-issued Authenticode signatures: $file"
            }
          }
      - name: Verify embedded application, portable and installer icons
        run: node desktop-client/scripts/verify-icons.cjs "docs/downloads/win-unpacked/SR MESH Desktop.exe" docs/downloads/SR-Mesh-Windows-Portable-v1.0.3.exe docs/downloads/SR-Mesh-Windows-Setup-v1.0.3.exe
      - name: Verify native preload and packaged dashboard
        shell: pwsh
        run: |
          $env:SR_MESH_SMOKE_TEST='1'
          $client = Start-Process -FilePath 'docs/downloads/win-unpacked/SR MESH Desktop.exe' -WindowStyle Hidden -PassThru
          if (-not $client.WaitForExit(30000)) { Stop-Process -Id $client.Id; throw 'Workspace startup timed out' }
          if ($client.ExitCode -ne 0) { throw 'Native dashboard/preload smoke check failed' }
          $executables = Get-Item docs/downloads/SR-Mesh-Windows-Portable-v1.0.3.exe, docs/downloads/SR-Mesh-Windows-Setup-v1.0.3.exe
          $executables | ForEach-Object { "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name } | Set-Content docs/downloads/SR-Mesh-Native-v1.0.3.sha256 -Encoding ascii
      - uses: actions/upload-artifact@v4
        with:
          name: SR-Mesh-Native-Portable
          path: |
            docs/downloads/SR-Mesh-Windows-Portable-v1.0.3.exe
            docs/downloads/SR-Mesh-Windows-Setup-v1.0.3.exe
            docs/downloads/SR-Mesh-Native-v1.0.3.sha256
          if-no-files-found: error
      - name: Publish executable
        if: startsWith(github.ref, 'refs/tags/desktop-client-v')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: pwsh
        run: |
          gh release create $env:GITHUB_REF_NAME docs/downloads/SR-Mesh-Windows-Portable-v1.0.3.exe docs/downloads/SR-Mesh-Windows-Setup-v1.0.3.exe docs/downloads/SR-Mesh-Native-v1.0.3.sha256 --verify-tag --latest=false --title 'SR Mesh Native Workspace v1.0.3' --notes 'Portable Windows x64 executable with bundled gateway dashboard and native LAN HTTP/WebSocket transport. Gateway access key required. HTTP is unencrypted; HTTPS certificate verification remains enabled. Authenticode signatures verified; SHA-256 checksum included. Smart App Control acceptance depends on Microsoft trust and policy.'
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }
